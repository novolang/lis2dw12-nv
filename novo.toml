[package]
name        = "lis2dw12-nv"
version     = "0.1.0"
description = "A driver for ST's LIS2DW12 three-axis accelerometer on an I2C or an SPI bus: the acceleration in milli-g at 12 or 14 bits by mode, the four full scales, the high-performance and the four low-power modes, the rates, the single conversion on demand, the data-ready line, the FIFO as an option, the wake-up, tap, free-fall and orientation detectors as configuration with their interrupt routing, the die temperature, the self-test and WHO_AM_I, as devices-nv's Accelerometer, Thermometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["lis2dw12", "accelerometer", "thermometer", "tap", "free-fall", "i2c", "spi", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/lis2dw12-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.1"

# The package is checked at the embedded tier, the strictest one, so
# every function in it is also valid at rt and system.
[tier]
tier = "embedded"

[docs.pages]
"README.md" = "Reading a LIS2DW12 accelerometer from a device program"

[dependencies]
# The board's I2C bus, SPI bus, GPIO and timer handles, and the I2cBus,
# SpiBus, GpioOut, TimerAsync and AsyncEdge traits.
# A path dependency until 0.4.0 is published: PATH-DEPENDENCIES.md in the
# parent directory lists the line that becomes "^0.4.0".
embedded-hal-nv = { path = "../embedded-hal-nv" }
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Accelerometer, Thermometer and Identifiable traits.
devices-nv      = { path = "../devices-nv" }
